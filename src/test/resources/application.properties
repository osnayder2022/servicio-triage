# Las pruebas de contexto no dependen de una instancia local de PostgreSQL.
# R2DBC solo requiere una URL válida para crear el contexto; no se abre una
# conexión mientras no se ejecute una consulta.
spring.r2dbc.url=r2dbc:postgresql://localhost:5432/triage_db
spring.r2dbc.username=postgres
spring.r2dbc.password=
spring.sql.init.mode=never
