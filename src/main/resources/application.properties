spring.application.name=servicio-triage
server.port=8080

# Conexión reactiva a PostgreSQL vía R2DBC
spring.r2dbc.url=r2dbc:postgresql://localhost:5432/triage_db
spring.r2dbc.username=postgres
spring.r2dbc.password=tu_password

# Pool de conexiones R2DBC
spring.r2dbc.pool.enabled=true
spring.r2dbc.pool.initial-size=5
spring.r2dbc.pool.max-size=20
spring.r2dbc.pool.max-idle-time=30m

# Inicialización de esquema SQL (opcional: colocas schema.sql / data.sql en src/main/resources)
spring.sql.init.mode=never


# Conexión al clúster de Kafka
spring.kafka.bootstrap-servers=localhost:9092

# Serialización de clave y valor (JSON)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Fiabilidad y reintentos del producer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.batch-size=16384
spring.kafka.producer.buffer-memory=33554432
spring.kafka.producer.compression-type=snappy

# Propiedades adicionales de Kafka Producer
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.properties.spring.json.add.type.headers=false