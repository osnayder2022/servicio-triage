apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: servicio-triage
  namespace: vidacruz-prod
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
    - host: triage.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: servicio-triage
                port:
                  name: http
